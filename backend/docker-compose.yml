services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Dev-окружение: пароль существует только локально и не покидает машину.
      # Для других значений создайте backend/.env (в git не попадает).
      POSTGRES_USER: ${POSTGRES_USER:-graphwar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphwar}
      POSTGRES_DB: ${POSTGRES_DB:-graphwar}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphwar} -d ${POSTGRES_DB:-graphwar}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
